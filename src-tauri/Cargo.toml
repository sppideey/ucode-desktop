[package]
name = "ucode"
version = "1.4.0"
description = "ucode desktop: a native window around the free coding agent. Made and tested by om dixit."
authors = ["om dixit"]
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12+: on_permission_request, so the app's page can use the microphone.
tauri = { version = "2.12", features = [] }
# Installs a newer release from GitHub when the app opens.
tauri-plugin-updater = "2"
# generate_context! reads the updater settings with it.
serde_json = "1"
# The system's own folder picker, opened at once (no PowerShell to start first).
tauri-plugin-dialog = "2"
# Starts the app again after the page puts an update on (on a Mac).
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
