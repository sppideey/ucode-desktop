# SPDX-License-Identifier: AGPL-3.0-only - ucode, made and tested by om dixit. Additional terms: see NOTICE.
[package]
name = "ucode"
version = "1.69.0"
description = "ucode desktop: a native window around the free coding agent. Made and tested by om dixit."
authors = ["om dixit"]
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12+: on_permission_request, so the app's page can use the microphone.
tauri = { version = "2.12", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
